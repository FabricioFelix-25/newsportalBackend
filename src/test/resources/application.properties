# Os testes sempre usam banco descartável em memória, sem configurações de produção.
spring.datasource.url=jdbc:h2:mem:alpesnews-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.bootstrap.admin.enabled=false
app.security.jwt.secret=only-for-local-tests-do-not-use-in-production-123456789
app.security.jwt.expiration-minutes=180
app.ai.api-key=local-test-bot-key
file.upload-dir=target/test-uploads
